name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run test/build gate before deploy (uncheck only for an emergency hotfix)
        required: false
        default: true
        type: boolean

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      run_tests: ${{ steps.gate.outputs.run_tests }}
    steps:
      - name: Decide whether to run the test/build gate
        id: gate
        # Always run the gate on push to main. Only a manual dispatch that
        # explicitly unchecks run_tests may bypass it (emergency hotfix).
        run: echo "run_tests=${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_tests == 'true' }}" >> "$GITHUB_OUTPUT"

  test_and_build:
    name: Test And Build Gate
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.run_tests == 'true'
    environment: Testing
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Locate Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.4-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.4-composer-

      - name: Verify test prerequisites (fail loudly)
        run: |
          set -euo pipefail

          if [ ! -f phpunit.xml ] || [ ! -d tests ]; then
            echo "::error::Deploy gate cannot run: missing phpunit.xml or tests/ directory."
            exit 1
          fi

          if grep -q '"livewire/flux"' composer.json && { [ -z "${{ secrets.FLUX_USERNAME }}" ] || [ -z "${{ secrets.FLUX_LICENSE_KEY }}" ]; }; then
            echo "::error::Deploy gate cannot run: FLUX_USERNAME and FLUX_LICENSE_KEY secrets are required to install dependencies. Set them on the Testing environment."
            exit 1
          fi

      - name: Configure Flux composer auth
        env:
          FLUX_USERNAME: ${{ secrets.FLUX_USERNAME }}
          FLUX_LICENSE_KEY: ${{ secrets.FLUX_LICENSE_KEY }}
        run: composer config http-basic.composer.fluxui.dev "$FLUX_USERNAME" "$FLUX_LICENSE_KEY"

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare app key for CI
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Build frontend assets
        run: npm run build

      - name: Run tests in parallel
        run: php -d memory_limit=1G ./vendor/bin/pest --parallel --compact

  migration_safety:
    name: Migration Safety Gate
    runs-on: ubuntu-latest
    environment: Testing
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: everbranch_ci
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --password=root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: everbranch_ci
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - name: Checkout code with release history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none

      - name: Locate Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.4-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.4-composer-

      - name: Configure Flux composer auth
        env:
          FLUX_USERNAME: ${{ secrets.FLUX_USERNAME }}
          FLUX_LICENSE_KEY: ${{ secrets.FLUX_LICENSE_KEY }}
        run: composer config http-basic.composer.fluxui.dev "$FLUX_USERNAME" "$FLUX_LICENSE_KEY"

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare app key for migration rehearsal
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Resolve previous production commit
        id: migration-base
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base_sha="$PUSH_BEFORE"
          if [ -z "$base_sha" ] || printf '%s' "$base_sha" | grep --quiet '^0\{40\}$'; then
            base_sha="$(git rev-parse HEAD^)"
          fi
          echo "sha=$base_sha" >> "$GITHUB_OUTPUT"

      - name: Lint changed migrations
        run: php scripts/ci/lint-migrations.php --base="${{ steps.migration-base.outputs.sha }}"

      - name: Verify interrupted migration recovery
        run: php ./vendor/bin/pest tests/Integration/WorkflowStudioMySqlMigrationRecoveryTest.php --compact

      - name: Rehearse prior production schema upgrade
        run: scripts/ci/rehearse-migrations.sh "${{ steps.migration-base.outputs.sha }}"

      - name: Verify committed MySQL schema baseline
        run: scripts/ci/verify-mysql-schema-baseline.sh

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs:
      - setup
      - test_and_build
      - migration_safety
    # Deploy only when the gate passed. A 'skipped' gate is allowed ONLY for the
    # manual emergency-hotfix path (workflow_dispatch with run_tests unchecked);
    # on a normal push the gate runs, so a test failure here blocks the deploy.
    if: >
      always() &&
      needs.setup.result == 'success' &&
      needs.migration_safety.result == 'success' &&
      (needs.test_and_build.result == 'success' ||
        (needs.test_and_build.result == 'skipped' && github.event_name == 'workflow_dispatch'))
    environment:
      name: production
    steps:
      - name: Checkout deployment diagnostics
        uses: actions/checkout@v6

      - name: Validate deployment secrets
        env:
          FORGE_DEPLOY_HOOK_URL: ${{ secrets.FORGE_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "$FORGE_DEPLOY_HOOK_URL" ]; then
            echo "::error::Missing required production secret: FORGE_DEPLOY_HOOK_URL"
            exit 1
          fi

      - name: Report operational observer configuration
        continue-on-error: true
        env:
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
          FORGE_ORGANIZATION_SLUG: ${{ vars.FORGE_ORGANIZATION_SLUG }}
          FORGE_SERVER_ID: ${{ vars.FORGE_SERVER_ID }}
          FORGE_SITE_ID: ${{ vars.FORGE_SITE_ID }}
        run: php scripts/ci/verify-forge-observer-config.php

      - name: Trigger Forge atomic release
        env:
          FORGE_DEPLOY_HOOK_URL: ${{ secrets.FORGE_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 --request POST "$FORGE_DEPLOY_HOOK_URL"

      - name: Verify the activated Forge release
        env:
          EXPECTED_RELEASE: ${{ github.sha }}
          READY_URL: https://app.theeverbranch.com/ready
        run: |
          set -euo pipefail

          for attempt in $(seq 1 18); do
            response="$(curl --fail --silent --show-error --max-time 15 "$READY_URL" || true)"

            if printf '%s' "$response" | grep --fixed-strings --quiet "\"release\":\"$EXPECTED_RELEASE\""; then
              echo "Forge activated $EXPECTED_RELEASE on attempt $attempt."
              exit 0
            fi

            echo "Waiting for Forge to activate $EXPECTED_RELEASE (attempt $attempt/18; response: $response)"
            sleep 10
          done

          echo "::error::Forge did not activate the expected release $EXPECTED_RELEASE. Production remains protected, but this deployment must be investigated before it can be called live."
          exit 1

      - name: Report latest Forge deployment after a verification failure
        if: failure()
        continue-on-error: true
        env:
          EXPECTED_RELEASE: ${{ github.sha }}
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
          FORGE_ORGANIZATION_SLUG: ${{ vars.FORGE_ORGANIZATION_SLUG }}
          FORGE_SERVER_ID: ${{ vars.FORGE_SERVER_ID }}
          FORGE_SITE_ID: ${{ vars.FORGE_SITE_ID }}
        run: php scripts/ci/report-forge-deployment.php
