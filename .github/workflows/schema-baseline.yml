name: Build MySQL Schema Baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-baseline:
    name: Build and verify disposable MySQL baseline
    runs-on: ubuntu-latest
    environment: Testing
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: everbranch_ci
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --password=root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: everbranch_ci
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Configure Flux Composer auth
        env:
          FLUX_USERNAME: ${{ secrets.FLUX_USERNAME }}
          FLUX_LICENSE_KEY: ${{ secrets.FLUX_LICENSE_KEY }}
        run: composer config http-basic.composer.fluxui.dev "$FLUX_USERNAME" "$FLUX_LICENSE_KEY"

      - run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare application key
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Build data-free MySQL schema baseline
        run: scripts/ci/refresh-mysql-schema-baseline.sh

      - name: Verify a blank MySQL database can boot from the baseline
        run: scripts/ci/verify-mysql-schema-baseline.sh

      - name: Upload reviewed baseline candidate
        uses: actions/upload-artifact@v4
        with:
          name: mysql-schema-baseline
          path: database/schema/
          if-no-files-found: error
          retention-days: 7
