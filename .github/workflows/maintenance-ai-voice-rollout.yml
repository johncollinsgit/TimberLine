name: Audit AI Voice Rollout

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only tenant audit or exact approved $20 access price preparation
        required: true
        default: audit
        type: choice
        options:
          - audit
          - prepare-access-price
          - verify-fictional-conversation
      confirm_apply:
        description: Apply the fixed price or run two capped fictional questions; neither creates a customer or subscription
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ai-voice-rollout-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    name: Audit exact deployed AI release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout the public audit encryption recipient
        uses: actions/checkout@v6

      - name: Validate exact deployed release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          EXPECTED_RELEASE: ${{ github.sha }}
        run: |
          set -euo pipefail
          for var in DEPLOY_HOST DEPLOY_USER DEPLOY_PORT DEPLOY_PATH DEPLOY_SSH_KEY; do
            if [ -z "${!var}" ]; then echo "::error::Missing required secret: $var"; exit 1; fi
          done
          ready="$(curl --fail --silent --show-error --max-time 20 https://app.theeverbranch.com/ready)"
          printf '%s' "$ready" | grep --fixed-strings --quiet "\"release\":\"$EXPECTED_RELEASE\""

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Run the fixed approved operation
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          OPERATION: ${{ inputs.operation }}
          APPLY: ${{ inputs.confirm_apply }}
        run: |
          set -euo pipefail
          remote=(ssh -o BatchMode=yes -o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST")
          case "$OPERATION" in
            audit)
              "${remote[@]}" "set -euo pipefail; cd '$DEPLOY_PATH'; php artisan ai-branch:audit-voice --json" > "$RUNNER_TEMP/ai-voice-audit.json"
              ;;
            prepare-access-price)
              "${remote[@]}" "set -euo pipefail; cd '$DEPLOY_PATH'; php artisan ai-branch:prepare-access-price"
              if [ "$APPLY" = "true" ]; then
                "${remote[@]}" "set -euo pipefail; cd '$DEPLOY_PATH'; php artisan ai-branch:prepare-access-price --apply --authorization='owner-approved-ai-20-monthly-20261020-run-$GITHUB_RUN_ID'"
              fi
              ;;
            verify-fictional-conversation)
              args="--owner-id=1 --acceptance-id='pilot-acceptance-$GITHUB_RUN_ID'"
              if [ "$APPLY" = "true" ]; then args="$args --apply --force-production --authorization='owner-approved-five-dollar-pilot-run-$GITHUB_RUN_ID'"; fi
              "${remote[@]}" "set -euo pipefail; cd '$DEPLOY_PATH'; php artisan ai-branch:verify-fictional-conversation $args" > "$RUNNER_TEMP/ai-voice-acceptance.txt"
              ;;
            *) echo 'Unsupported operation'; exit 1 ;;
          esac

      - name: Encrypt private audit output for the owner
        if: inputs.operation == 'audit' || inputs.operation == 'verify-fictional-conversation'
        run: |
          set -euo pipefail
          for file in "$RUNNER_TEMP/ai-voice-audit.json" "$RUNNER_TEMP/ai-voice-acceptance.txt"; do
            if [ -f "$file" ]; then
              openssl cms -encrypt -binary -aes-256-gcm -in "$file" -outform DER -out "$file.cms" -recip resources/operations/ai-voice-audit-recipient.pem -keyopt rsa_padding_mode:oaep -keyopt rsa_oaep_md:sha256
              rm -- "$file"
            fi
          done
          echo 'Private audit encrypted for the owner; no tenant data or model reply printed.'

      - name: Retain read-only tenant audit
        if: inputs.operation == 'audit' || inputs.operation == 'verify-fictional-conversation'
        uses: actions/upload-artifact@v4
        with:
          name: ai-voice-audit-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ai-voice-audit.json.cms
            ${{ runner.temp }}/ai-voice-acceptance.txt.cms
          if-no-files-found: error
          retention-days: 7
