name: Enterprise isolated runtime
'on':
  pull_request:
    paths:
    - apps/enterprise/**
    - app/Enterprise/**
    - app/Proposals/**
    - bootstrap/providers.php
    - app/Foundation/Enterprise*.php
    - app/Providers/Enterprise*.php
    - app/Http/Middleware/EnsureEnterpriseRuntime.php
    - app/Http/Middleware/EnterpriseCsrfToken.php
    - app/Http/Middleware/EnsureEnterpriseTrialMount.php
    - app/Http/Middleware/EnsureEnterprisePrefixMount.php
    - app/Http/Middleware/EnsureEnterpriseClientSilo.php
    - app/Http/Controllers/LeesMcRaeCampusDemoController.php
    - app/Services/Team/**
    - app/Services/AiBranch/ResponsesTransport.php
    - app/Services/AiBranch/AiBranchProvider.php
    - app/Policies/Team*.php
    - config/enterprise.php
    - config/service_proposals.php
    - routes/enterprise.php
    - routes/service-proposals.php
    - routes/campus-demo.php
    - resources/data/enterprise/**
    - resources/views/enterprise/**
    - resources/views/service-proposals/**
    - resources/js/enterprise/**
    - resources/js/ai-voice-conversation.js
    - vite.enterprise.config.js
    - scripts/everbranch-team/enterprise-*
    - scripts/proposals/review-browser.mjs
    - scripts/proposals/activity-browser.mjs
    - resources/js/service-proposals/**
    - scripts/proposals/financial-browser.mjs
    - tests/Feature/Enterprise/**
    - tests/Feature/Proposals/**
    - tests/Support/proposal-review-browser*.php
    - tests/Support/proposal-financial-browser-inspect.php
    - tests/Feature/LeesMcRaeCampusDemoTest.php
    - tests/e2e/enterprise-*
    - tests/browser/enterprise-voice-jobs.smoke.mjs
    - tests/browser/enterprise-read-only-assistant.smoke.mjs
    - tests/browser/enterprise-conversation.smoke.mjs
    - tests/Support/enterprise-https-router.php
    - tests/Support/enterprise-browser-voice-provider.php
    - tests/Support/enterprise-conversation-browser-fixture.php
    - tests/Support/enterprise-conversation-browser-router.php
    - tests/Integration/EnterpriseMySqlMigrationRecoveryTest.php
    - tests/Integration/EnterpriseTrialBudgetMySqlConcurrencyTest.php
    - tests/Integration/EnterpriseConversationMySqlConcurrencyTest.php
    - tests/Integration/EnterpriseMemoryMySqlConcurrencyTest.php
    - tests/Support/EnterpriseConversationFixture.php
    - tests/Integration/EnterpriseClientProvisioningMySqlTest.php
    - tests/Integration/migration-recovery-manifest.php
    - phpunit.enterprise.xml
    - phpunit.team.xml
    - .github/workflows/enterprise-runtime-ci.yml
    - .github/workflows/tests.yml
    - .github/workflows/lint.yml
    - composer.lock
    - package-lock.json
    - package.json
    - database/migrations/**
    - docs/operations/enterprise-ci.md
    - docs/operations/enterprise-voice-*.md
    - .github/actions/enterprise-ci-runtime/**
    - scripts/ci/enterprise-*
    - tests/ci/test_enterprise_ci_bundle.py
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  prepare:
    name: Enterprise inputs and contracts
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.inputs.outputs.artifact }}
      producer-attempt: ${{ steps.inputs.outputs.producer-attempt }}
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/enterprise-ci-runtime
      with:
        npm-cache: npm
    - name: Check workflow and bundle isolation contracts
      run: |-
        node --test tests/e2e/enterprise-ci-plan.test.mjs
        python3 -m unittest discover -s tests/ci -p "test_enterprise_ci_bundle.py" -v
    - name: Find Composer download cache
      id: composer-cache
      run: echo "directory=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.directory }}
        key: enterprise-composer-${{ runner.os }}-php84-${{ hashFiles('composer.lock') }}
        restore-keys: enterprise-composer-${{ runner.os }}-php84-
    - run: composer install --no-interaction --prefer-dist --no-scripts
    - name: Prepare empty isolated test environment files
      run: php -r 'foreach ([".env", "apps/enterprise/.env"] as $path) { if (!is_file($path)) { file_put_contents($path, ""); } }'
    - run: npm ci
    - name: Check private transport and isolated sample contracts
      run: node --test tests/e2e/enterprise-transport.test.mjs tests/e2e/enterprise-reviewer-sample.test.mjs tests/e2e/enterprise-job-sample-upgrade.test.mjs tests/e2e/enterprise-job-sample-commands.test.mjs
        tests/e2e/enterprise-work-scope-map.test.mjs tests/e2e/enterprise-workspace-tour.test.mjs tests/e2e/enterprise-procedures-ui.test.mjs tests/e2e/enterprise-resource-presentation.test.mjs
        tests/e2e/enterprise-resource-history-time.test.mjs tests/e2e/enterprise-buildings-map-state.test.mjs tests/e2e/enterprise-request-building.test.mjs tests/e2e/enterprise-read-only-assistant.test.mjs
        tests/e2e/enterprise-conversation.test.mjs tests/e2e/enterprise-saved-assistants.test.mjs tests/e2e/enterprise-private-memory.test.mjs tests/e2e/enterprise-tour-position.test.mjs
        tests/e2e/enterprise-work-table-drawer.test.mjs tests/e2e/enterprise-detail-placement.test.mjs tests/e2e/enterprise-project-detail-generation.test.mjs tests/e2e/enterprise-work-views.test.mjs
        tests/e2e/enterprise-roll-call-projects.test.mjs tests/e2e/enterprise-shell-navigation.test.mjs tests/e2e/enterprise-preference-lifecycle.test.mjs tests/e2e/enterprise-theme.test.mjs
        tests/e2e/enterprise-executive.test.mjs tests/e2e/enterprise-role-preview.test.mjs tests/js/enterprise-sample-voice.test.mjs tests/js/enterprise-usage.test.mjs
        tests/e2e/ai-voice-conversation.test.mjs tests/e2e/enterprise-voice-jobs.test.mjs tests/e2e/enterprise-request-classification-draft.test.mjs
    - name: Check voice shell scope without providers
      run: node --test tests/e2e/enterprise-voice-shell-scope.test.mjs
    - run: npm run build:enterprise
    - name: Package exact-commit disposable CI inputs
      run: python3 scripts/ci/enterprise-ci-bundle.py create
    - uses: actions/upload-artifact@v4
      with:
        name: enterprise-ci-inputs-${{ github.run_id }}-${{ github.run_attempt }}
        path: test-results/enterprise-ci-inputs
        if-no-files-found: error
        retention-days: 7
        compression-level: 0
    - name: Record reusable input artifact
      id: inputs
      run: |
        echo "artifact=enterprise-ci-inputs-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
        echo "producer-attempt=${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
  native:
    name: Enterprise PHP and MySQL
    needs: prepare
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: everbranch_enterprise_ci
          MYSQL_ROOT_PASSWORD: enterprise-ci-fixture
        ports:
        - 3306:3306
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -penterprise-ci-fixture" --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      ENTERPRISE_DISPOSABLE_MYSQL: '1'
      ENTERPRISE_DB_DRIVER: mysql
      ENTERPRISE_DB_HOST: 127.0.0.1
      ENTERPRISE_DB_PORT: '3306'
      ENTERPRISE_DB_DATABASE: everbranch_enterprise_ci
      ENTERPRISE_DB_USERNAME: root
      ENTERPRISE_DB_PASSWORD: enterprise-ci-fixture
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/enterprise-ci-runtime
    - uses: actions/download-artifact@v4
      with:
        name: ${{ needs.prepare.outputs.artifact }}
        path: test-results/enterprise-ci-inputs
    - name: Verify and restore same-run same-commit inputs
      env:
        ENTERPRISE_CI_INPUT_ATTEMPT: ${{ needs.prepare.outputs.producer-attempt }}
      run: python3 scripts/ci/enterprise-ci-bundle.py restore
    - name: Prepare empty isolated test environment files
      run: php -r 'foreach ([".env", "apps/enterprise/.env"] as $path) { if (!is_file($path)) { file_put_contents($path, ""); } }'
    - run: php apps/enterprise/scripts/lint-schema.php
    - run: php vendor/bin/phpunit -c phpunit.enterprise.xml --display-warnings
    - name: Check voice lifecycle and scoped job lookup without providers
      run: |
        php vendor/bin/pest -c phpunit.team.xml tests/Feature/Enterprise/EnterpriseVoiceJobsTest.php tests/Feature/Enterprise/EnterpriseVoiceAssistantTest.php --compact --display-warnings
    - name: Check shared reviewer rendering without account or route authority
      run: php vendor/bin/pest -c phpunit.team.xml tests/Feature/Enterprise/EnterpriseReviewerRenderTest.php tests/Feature/Enterprise/EnterpriseResourcePresentationTest.php
        tests/Feature/Enterprise/EnterpriseReviewerTrialEntryTest.php tests/Feature/EnterpriseReviewerPublicTest.php tests/Feature/LeesMcRaeCampusDemoTest.php --compact
        --display-warnings
    - name: Check immutable proposal and version-bound campus review policies
      run: php vendor/bin/pest -c phpunit.team.xml tests/Feature/Proposals --compact --display-warnings
    - name: Check permission-filtered period reports and certificate register
      run: php vendor/bin/pest -c phpunit.team.xml tests/Feature/Enterprise/EnterpriseContractorCertificatesTest.php tests/Feature/Enterprise/EnterpriseReportExportTest.php
        tests/Feature/Enterprise/EnterpriseFinancePacketsTest.php tests/Feature/Enterprise/EnterpriseOperationsTest.php --compact --display-warnings
    - name: Check read-only voice and usage ledger policies without providers
      run: php vendor/bin/pest -c phpunit.team.xml tests/Feature/Enterprise/EnterpriseVoiceJobsTest.php tests/Feature/Enterprise/EnterpriseUsageOverviewTest.php --compact
        --display-warnings
    - name: Check controlled trial pages in the dedicated runtime without providers
      run: php vendor/bin/pest -c phpunit.enterprise.xml tests/Feature/Enterprise/EnterpriseTrialPagesTest.php --compact --display-warnings
  browser:
    name: Enterprise browser (${{ matrix.id }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
        - id: operations-work-chromium
          kind: operations
          engine: chromium
          group: work
        - id: operations-work-webkit
          kind: operations
          engine: webkit
          group: work
        - id: operations-tour-chromium
          kind: operations
          engine: chromium
          group: tour
        - id: operations-tour-webkit
          kind: operations
          engine: webkit
          group: tour
        - id: operations-workspace-chromium
          kind: operations
          engine: chromium
          group: workspace
        - id: operations-workspace-webkit
          kind: operations
          engine: webkit
          group: workspace
        - id: native-chromium
          kind: native
          engine: chromium
          group: ''
        - id: native-webkit
          kind: native
          engine: webkit
          group: ''
        - id: proposal-chromium
          kind: proposal
          engine: chromium
          group: ''
        - id: proposal-webkit
          kind: proposal
          engine: webkit
          group: ''
        - id: reviewer-chromium
          kind: reviewer
          engine: chromium
          group: ''
        - id: reviewer-webkit
          kind: reviewer
          engine: webkit
          group: ''
        - id: components
          kind: components
          engine: both
          group: ''
    env:
      ENTERPRISE_TEST_PHP: php
      EVERBRANCH_PLAYWRIGHT_MODULE: node_modules/playwright/index.mjs
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/enterprise-ci-runtime
    - uses: actions/download-artifact@v4
      with:
        name: ${{ needs.prepare.outputs.artifact }}
        path: test-results/enterprise-ci-inputs
    - name: Verify and restore same-run same-commit inputs
      env:
        ENTERPRISE_CI_INPUT_ATTEMPT: ${{ needs.prepare.outputs.producer-attempt }}
      run: python3 scripts/ci/enterprise-ci-bundle.py restore
    - name: Prepare empty isolated test environment files
      run: php -r 'foreach ([".env", "apps/enterprise/.env"] as $path) { if (!is_file($path)) { file_put_contents($path, ""); } }'
    - name: Install browser dependencies
      timeout-minutes: 45
      run: npx playwright install --with-deps chromium webkit
    - name: Check read-only assistant controls without a provider
      env:
        ENTERPRISE_EVIDENCE: test-results/enterprise/read-only-assistant
      run: node tests/browser/enterprise-read-only-assistant.smoke.mjs
      if: matrix.kind == 'components'
    - name: Check conversation UI with isolated runtime and fake HTTP only
      env:
        ENTERPRISE_TEST_PHP: php
        EVERBRANCH_PLAYWRIGHT_MODULE: node_modules/playwright/index.mjs
        ENTERPRISE_EVIDENCE: test-results/enterprise/conversation
      run: node tests/browser/enterprise-conversation.smoke.mjs
      if: matrix.kind == 'components'
    - name: Check Blaine demo ticket queue, project catalog and tour in Chromium and WebKit
      env:
        ENTERPRISE_TEST_PHP: php
        EVERBRANCH_PLAYWRIGHT_MODULE: node_modules/playwright/index.mjs
        ENTERPRISE_EVIDENCE: test-results/enterprise/job-sample
      run: node scripts/everbranch-team/enterprise-job-sample-browser.mjs
      if: matrix.kind == 'components'
    - name: Check job voice controls with fake speech in Chromium and WebKit
      env:
        VOICE_WEBKIT: '1'
        VOICE_EVIDENCE_DIR: test-results/enterprise/voice-jobs
      run: node tests/browser/enterprise-voice-jobs.smoke.mjs
      if: matrix.kind == 'components'
    - name: Check persistent Enterprise UI in Chromium and WebKit
      env:
        ENTERPRISE_TEST_PHP: php
        EVERBRANCH_PLAYWRIGHT_MODULE: node_modules/playwright/index.mjs
        engine: ${{ matrix.engine }}
      run: |
        ENTERPRISE_BROWSER_ENGINE="$engine" ENTERPRISE_EVIDENCE=test-results/enterprise/$engine node scripts/everbranch-team/enterprise-browser-smoke.mjs
      if: matrix.kind == 'native'
    - name: Check native job and ticket wizards in Chromium and WebKit
      env:
        ENTERPRISE_TEST_PHP: php
        EVERBRANCH_PLAYWRIGHT_MODULE: node_modules/playwright/index.mjs
        engine: ${{ matrix.engine }}
      run: |
        ENTERPRISE_TEST_OPERATIONS=1 ENTERPRISE_OPERATIONS_SCENARIO=jobs ENTERPRISE_BROWSER_ENGINE="$engine" ENTERPRISE_EVIDENCE=test-results/enterprise/jobs/$engine node scripts/everbranch-team/enterprise-browser-smoke.mjs
      if: matrix.kind == 'native'
    - name: Check persisted proposal and campus page review in Chromium and WebKit
      timeout-minutes: 20
      env:
        ENTERPRISE_TEST_PHP: php
        EVERBRANCH_PLAYWRIGHT_MODULE: node_modules/playwright/index.mjs
        engine: ${{ matrix.engine }}
      run: |
        PROPOSAL_BROWSER_ENGINE="$engine" PROPOSAL_BROWSER_EVIDENCE="test-results/enterprise/proposal-review/$engine" node scripts/proposals/review-browser.mjs
        PROPOSAL_BROWSER_ENGINE="$engine" PROPOSAL_BROWSER_EVIDENCE="test-results/enterprise/proposal-activity/$engine" node scripts/proposals/activity-browser.mjs
      if: matrix.kind == 'proposal'
    - name: Check private Financial planning cart in Chromium and WebKit
      timeout-minutes: 10
      env:
        ENTERPRISE_TEST_PHP: php
        EVERBRANCH_PLAYWRIGHT_MODULE: node_modules/playwright/index.mjs
        engine: ${{ matrix.engine }}
      run: |
        PROPOSAL_BROWSER_ENGINE="$engine" PROPOSAL_BROWSER_EVIDENCE="test-results/enterprise/proposal-financial/$engine" node scripts/proposals/financial-browser.mjs
      if: matrix.kind == 'proposal'
    - name: Check reviewer tour and shared renderer in Chromium and WebKit
      timeout-minutes: 15
      env:
        ENTERPRISE_TEST_PHP: php
        EVERBRANCH_PLAYWRIGHT_MODULE: node_modules/playwright/index.mjs
        engine: ${{ matrix.engine }}
      run: |
        ENTERPRISE_BROWSER_ENGINE="$engine" ENTERPRISE_EVIDENCE="test-results/enterprise/reviewer-tour/$engine" node scripts/everbranch-team/enterprise-reviewer-tour-browser.mjs
        ENTERPRISE_BROWSER_ENGINE="$engine" ENTERPRISE_EVIDENCE="test-results/enterprise/reviewer-shared/$engine" node scripts/everbranch-team/enterprise-reviewer-browser.mjs
      if: matrix.kind == 'reviewer'
    - name: Check native Operations Roll Call and Resources in Chromium and WebKit
      timeout-minutes: 45
      env:
        ENTERPRISE_TEST_PHP: php
        EVERBRANCH_PLAYWRIGHT_MODULE: node_modules/playwright/index.mjs
        ENTERPRISE_TEST_OPERATIONS: '1'
        ENTERPRISE_OPERATIONS_SCENARIO: all
        engine: ${{ matrix.engine }}
        ENTERPRISE_OPERATIONS_GROUP: ${{ matrix.group }}
      run: |
        ENTERPRISE_BROWSER_ENGINE="$engine" ENTERPRISE_EVIDENCE="test-results/enterprise/operations/${{ matrix.group }}/$engine" node scripts/everbranch-team/enterprise-browser-smoke.mjs
      if: matrix.kind == 'operations'
    - name: Check priorities walkthrough and public procedural screens
      timeout-minutes: 15
      env:
        ENTERPRISE_TEST_PHP: php
        EVERBRANCH_PLAYWRIGHT_MODULE: node_modules/playwright/index.mjs
        engine: ${{ matrix.engine }}
      run: |
        ENTERPRISE_BROWSER_ENGINE="$engine" ENTERPRISE_EVIDENCE="test-results/enterprise/priorities/$engine" node scripts/everbranch-team/enterprise-priorities-browser.mjs
        ENTERPRISE_BROWSER_ENGINE="$engine" ENTERPRISE_EVIDENCE="test-results/enterprise/public-procedures/$engine" node scripts/everbranch-team/enterprise-public-procedures-browser.mjs
      if: matrix.kind == 'reviewer'
    - name: Check generated voice in actual private shell with provider-only fake
      timeout-minutes: 10
      env:
        ENTERPRISE_TEST_PHP: php
        EVERBRANCH_PLAYWRIGHT_MODULE: node_modules/playwright/index.mjs
        ENTERPRISE_TEST_OPERATIONS: '1'
        ENTERPRISE_OPERATIONS_SCENARIO: voice-generation
        engine: ${{ matrix.engine }}
      run: |
        ENTERPRISE_BROWSER_ENGINE="$engine" ENTERPRISE_EVIDENCE="test-results/enterprise/voice-generation/$engine" node scripts/everbranch-team/enterprise-browser-smoke.mjs
      if: matrix.kind == 'native'
    - name: Record lane identity
      if: always()
      env:
        LANE: ${{ matrix.id }}
        COMMIT: ${{ github.sha }}
      run: 'printf "### Enterprise lane: %s\nCommit: %s\n" "$LANE" "$COMMIT" >> "$GITHUB_STEP_SUMMARY"'
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: enterprise-ui-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: test-results/enterprise
        if-no-files-found: ignore
        retention-days: 7
  enterprise-runtime:
    name: enterprise-runtime
    if: always()
    needs:
    - prepare
    - native
    - browser
    runs-on: ubuntu-latest
    steps:
    - name: Require every Enterprise verification job
      env:
        NEEDS_JSON: ${{ toJSON(needs) }}
      run: |-
        python3 - <<'PY'
        import json, os
        jobs = json.loads(os.environ['NEEDS_JSON'])
        if set(jobs) != {'prepare', 'native', 'browser'} or any(job['result'] != 'success' for job in jobs.values()):
            raise SystemExit('Enterprise verification incomplete: ' + json.dumps(jobs))
        print('All native/MySQL, contract/build and browser matrix jobs passed.')
        PY
