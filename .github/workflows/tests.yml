    - name: Build a baseline candidate when one is missing
      run: scripts/ci/refresh-mysql-schema-baseline.sh
      if: matrix.group == 'schema' && (!hashFiles('database/schema/mysql-schema.sql') || !hashFiles('database/schema/mysql-schema.sha256'))
    - name: Verify committed MySQL schema baseline
      run: scripts/ci/verify-mysql-schema-baseline.sh
      if: matrix.group == 'schema'
    - name: Upload MySQL schema baseline candidate
      uses: actions/upload-artifact@v4
      with:
        name: mysql-schema-baseline-${{ github.run_id }}
        path: database/schema/
        if-no-files-found: error
        retention-days: 7
      if: matrix.group == 'schema' && (always() && hashFiles('database/schema/mysql-schema.sql') && hashFiles('database/schema/mysql-schema.sha256'))
    - name: Require the reviewed baseline in source control
      run: |
        set -euo pipefail
        git ls-files --error-unmatch database/schema/mysql-schema.sql database/schema/mysql-schema.sha256 >/dev/null
      if: matrix.group == 'schema'
    # This fixture rebuilds the complete disposable schema; keep it last in
    # the schema lane so its tables cannot affect another domain's recovery.
    - name: Verify rental recovery and competing owner claims
      env:
        TEAM_WORK_DISPOSABLE_MYSQL: '1'
