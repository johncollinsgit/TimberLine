name: tests

on:
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos
      - codex/everbranch-enterprise-intake
      - codex/enterprise-collaboration-ask
      - codex/enterprise-workflow-briefing
      - codex/enterprise-reviewer-operations
      - codex/enterprise-client-provisioning
      - codex/enterprise-prefixed-integrations
      - codex/enterprise-painpoint-demo
      - codex/enterprise-executive-visibility
      - codex/enterprise-voice-finale
  workflow_dispatch:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci (8.4)
    runs-on: ubuntu-24.04
    environment: Testing

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use official Ubuntu package mirrors
        timeout-minutes: 2
        shell: bash
        run: |
          # Noble runner mirror indirection: actions/runner-images c74a28e5f8943ae6a39cac7c3701dd6bd0a2ea51.
          sudo python3 - <<'PY'
          from pathlib import Path
          
          apt = Path('/etc/apt')
          sources = apt / 'sources.list.d/ubuntu.sources'
          mirrors = apt / 'apt-mirrors.txt'
          if any(path.is_symlink() or not path.is_file() for path in (sources, mirrors)):
              raise SystemExit('Unsupported Ubuntu APT source files; refusing mirror change.')
          source_before = sources.read_bytes()
          source_lines = source_before.decode('utf-8').splitlines()
          uri_lines = [line for line in source_lines if line.startswith('URIs:')]
          if (not uri_lines or any(line.split()[1:] != ['mirror+file:/etc/apt/apt-mirrors.txt'] for line in uri_lines)
                  or any(line[:1].isspace() and line.strip() and not line.lstrip().startswith('#') for line in source_lines)):
              raise SystemExit('Unsupported Ubuntu APT mirror indirection; refusing mirror change.')
          before = mirrors.read_bytes()
          lines = before.splitlines(keepends=True)
          entries = [(line, line.decode('utf-8').split()) for line in lines
                     if line.strip() and not line.lstrip().startswith(b'#')]
          if any(b'\t' not in line or line.split(b'\t', 1)[0].decode('utf-8') != fields[0] for line, fields in entries):
              raise SystemExit('Unsupported Ubuntu mirror metadata separator; refusing mirror change.')
          azure = ['http://azure.archive.ubuntu.com/ubuntu/', 'priority:1']
          official = [['https://archive.ubuntu.com/ubuntu/', 'priority:2'],
                      ['https://security.ubuntu.com/ubuntu/', 'priority:3']]
          records = [fields for _, fields in entries]
          if records not in ([azure, *official], official):
              raise SystemExit('Unsupported Ubuntu mirror list; refusing mirror change.')
          after = b''.join(line for line in lines if line.decode('utf-8').split() != azure)
          if after != before:
              mirrors.write_bytes(after)
          if mirrors.read_bytes() != after or sources.read_bytes() != source_before:
              raise SystemExit('Ubuntu mirror verification failed.')
          print('Ubuntu APT uses official HTTPS archive/security mirrors; Azure entry absent; source fields unchanged.')
          PY

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Locate Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.4-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.4-composer-

      - name: Configure Flux Composer auth
        env:
          FLUX_USERNAME: ${{ secrets.FLUX_USERNAME }}
          FLUX_LICENSE_KEY: ${{ secrets.FLUX_LICENSE_KEY }}
        run: composer config http-basic.composer.fluxui.dev "$FLUX_USERNAME" "$FLUX_LICENSE_KEY"

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Verify Team preservation and work contracts with synthetic data
        run: npm run test:team-work-local

      - name: Prepare safe PDF conversion
        run: |
          if ! command -v gs >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ghostscript
          fi
          echo "WHOLESALE_LABEL_GS=$(command -v gs)" >> "$GITHUB_ENV"

      - name: Build pinned custom-label vector tracer
        run: |
          rustup target add x86_64-unknown-linux-musl
          CARGO_BUILD_TARGET=x86_64-unknown-linux-musl CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=rust-lld scripts/labels/install-vtracer.sh "$RUNNER_TEMP/label-tools"
          sha256sum "$RUNNER_TEMP/label-tools/vtracer-0.6.5" > "$RUNNER_TEMP/label-tools/vtracer-0.6.5.sha256"
          echo "WHOLESALE_LABEL_VTRACER=$RUNNER_TEMP/label-tools/vtracer-0.6.5" >> "$GITHUB_ENV"

      - name: Retain pinned Linux label tracer
        uses: actions/upload-artifact@v4
        with:
          name: wholesale-label-tracer-linux
          path: |
            ${{ runner.temp }}/label-tools/vtracer-0.6.5
            ${{ runner.temp }}/label-tools/vtracer-0.6.5.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Prepare application key
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Build frontend assets
        run: npm run build

      - name: Validate subscription protocols against captured original-app schema
        run: node scripts/ci/validate-subscription-shopify-api.mjs

      - name: Install browsers for Fleet embedding checks
        timeout-minutes: 45
        run: npx playwright install --with-deps chromium webkit

      - name: Verify Birthday Club desktop and mobile states
        run: node tests/e2e/birthday-club-browser.mjs

      - name: Verify wholesale cart and private-label buyer workflows
        run: |
          node tests/e2e/wholesale-quantity-browser.mjs
          node tests/e2e/wholesale-labels-browser.mjs
          node tests/e2e/wholesale-reorder-browser.mjs
          node tests/e2e/wholesale-cart-refresh-browser.mjs
          node tests/e2e/wholesale-label-admin-browser.mjs
          node --test scripts/labels/batch-import.test.mjs
          npx tsc --noEmit -p extensions/wholesale-order-notes/tsconfig.json

      - name: Verify wholesale checkout validation Function
        run: |
          npm ci --prefix extensions/wholesale-checkout-access
          npm exec --yes --package=@shopify/cli@5.0.0 -- npm --prefix extensions/wholesale-checkout-access test -- --run

      - name: Verify retained bundle validation Function
        run: |
          npm ci --prefix extensions/everbranch-bundle-scent-validation
          npm exec --yes --package=@shopify/cli@5.0.0 -- npm --prefix extensions/everbranch-bundle-scent-validation test -- --run

      - name: Verify Fleet embedding and allowance in Chromium and WebKit
        run: npm run test:highlevel-fleet

      - name: Verify conversational voice, memory and stop controls with fictional fixtures
        run: node tests/browser/ai-voice-conversation.smoke.mjs

      - name: Verify workspace branch settings in Chromium and WebKit
        run: |
          BRANCH_SETTINGS_FIXTURES=1 php vendor/bin/pest --compact tests/Feature/Everbranch/BranchSettingsTest.php
          GUIDED_SETTINGS_FIXTURES=1 php vendor/bin/pest --compact tests/Feature/Onboarding/WorkspaceSettingsTest.php
          npx playwright test -c playwright.branches.config.ts

      - name: Verify Marketplace management in Chromium and WebKit
        run: |
          MARKETPLACE_CONSOLE_FIXTURES=1 php vendor/bin/pest --compact tests/Feature/Marketplace/MarketManagementTest.php
          npx playwright test -c playwright.marketplace.config.ts

      - name: Verify public offer and accessibility in Chromium and WebKit
        # Public browser checks share the already installed Fleet browsers.
        # Platform-specific screenshot baselines are verified locally.
        # No live form submission or Lighthouse evidence upload occurs here.
        run: npx playwright test -c playwright.public.config.ts --grep-invert 'stable public'

      - name: Run PHP tests in parallel
        run: php -d memory_limit=1G ./vendor/bin/pest --parallel --compact

  mysql-migration:
    name: mysql migration recovery
    runs-on: ubuntu-latest
    environment: Testing
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: everbranch_ci
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --password=root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: everbranch_ci
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Locate Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.4-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.4-composer-

      - name: Configure Flux Composer auth
        env:
          FLUX_USERNAME: ${{ secrets.FLUX_USERNAME }}
          FLUX_LICENSE_KEY: ${{ secrets.FLUX_LICENSE_KEY }}
        run: composer config http-basic.composer.fluxui.dev "$FLUX_USERNAME" "$FLUX_LICENSE_KEY"

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare application key
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Resolve migration rehearsal baseline
        id: migration-base
        env:
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base_sha="$PULL_REQUEST_BASE"
          if [ -z "$base_sha" ]; then
            base_sha="$(git rev-parse HEAD^)"
          fi
          echo "sha=$base_sha" >> "$GITHUB_OUTPUT"

      - name: Lint changed migrations
        run: php scripts/ci/lint-migrations.php --base="${{ steps.migration-base.outputs.sha }}"

      - name: Verify clean and partial migration paths
        env:
          TEAM_WORK_DISPOSABLE_MYSQL: '1'
          SES_PLATFORM_DISPOSABLE_MYSQL: '1'
          WHOLESALE_LABELS_DISPOSABLE_MYSQL: '1'
        run: php ./vendor/bin/pest tests/Integration/WholesaleLabelsMySqlRecoveryTest.php tests/Integration/WorkflowStudioMySqlMigrationRecoveryTest.php tests/Integration/HighLevelFleetMySqlMigrationRecoveryTest.php tests/Integration/TenantMailMySqlMigrationRecoveryTest.php tests/Integration/FleetOperationsMySqlMigrationRecoveryTest.php tests/Integration/SoccerMySqlMigrationRecoveryTest.php tests/Integration/SoccerAllocationConcurrencyTest.php tests/Integration/MarketingDeskMySqlRecoveryTest.php tests/Integration/ReviewedSchemaDriftRecoveryTest.php tests/Integration/AiBranchMySqlMigrationRecoveryTest.php tests/Integration/TeamWorkMySqlMigrationRecoveryTest.php tests/Integration/MarketplaceMySqlRecoveryTest.php tests/Integration/PlatformMailMySqlRecoveryTest.php tests/Integration/ServiceProposalMySqlRecoveryTest.php tests/Integration/FieldMaterialReviewMySqlRecoveryTest.php --compact

      - name: Verify native Teams search migration recovery
        env:
          TEAM_WORK_DISPOSABLE_MYSQL: '1'
        run: php ./vendor/bin/pest tests/Integration/TeamSearchMySqlRecoveryTest.php --compact

      - name: Verify subscription pilot evidence partial-DDL recovery
        run: php ./vendor/bin/pest tests/Integration/BirthdayClubMySqlRecoveryTest.php tests/Integration/SubscriptionPilotMySqlRecoveryTest.php tests/Integration/SubscriptionPilotExecutionMySqlRecoveryTest.php tests/Integration/SubscriptionBillingLedgerMySqlRecoveryTest.php tests/Integration/SubscriptionMemberVotesMySqlRecoveryTest.php --compact

      - name: Verify POS simulation partial-DDL recovery
        env:
          POS_DISPOSABLE_MYSQL: '1'
        run: php ./vendor/bin/pest tests/Integration/PointOfSaleMySqlRecoveryTest.php --compact

      - name: Rehearse prior production schema upgrade
        run: scripts/ci/rehearse-migrations.sh "${{ steps.migration-base.outputs.sha }}"

      - name: Build a baseline candidate when one is missing
        if: ${{ !hashFiles('database/schema/mysql-schema.sql') || !hashFiles('database/schema/mysql-schema.sha256') }}
        run: scripts/ci/refresh-mysql-schema-baseline.sh

      - name: Verify committed MySQL schema baseline
        run: scripts/ci/verify-mysql-schema-baseline.sh

      - name: Verify original subscription provider dispatch concurrency
        run: php ./vendor/bin/pest tests/Integration/SubscriptionBraintreeDispatchConcurrencyTest.php tests/Integration/SubscriptionShopifyAdoptionConcurrencyTest.php tests/Integration/SubscriptionShopifyBillingConcurrencyTest.php tests/Integration/SubscriptionShopifyUpdateDurabilityTest.php --compact

      - name: Verify subscription member actions and amendment concurrency
        run: php ./vendor/bin/pest tests/Integration/SubscriptionMemberVotingConcurrencyTest.php tests/Integration/SubscriptionMembershipReviewConcurrencyTest.php tests/Integration/SubscriptionBillingAmendmentConcurrencyTest.php tests/Integration/SubscriptionCustomerDeliveryConcurrencyTest.php --compact

      - name: Verify POS register and shared-stock concurrency
        env:
          POS_DISPOSABLE_MYSQL: '1'
        run: php ./vendor/bin/pest tests/Integration/PointOfSaleConcurrencyTest.php --compact

      - name: Verify platform SES durable claims and shared account concurrency
        env:
          SES_PLATFORM_DISPOSABLE_MYSQL: '1'
        run: php ./vendor/bin/pest tests/Integration/PlatformMailConcurrencyTest.php --compact

      - name: Verify tenant marketing AI budget concurrency
        run: php ./vendor/bin/pest tests/Integration/MarketingDeskConcurrencyTest.php --compact

      - name: Verify platform email outbox queues and delivery evidence
        run: php ./vendor/bin/pest tests/Integration/PlatformSesOutboxTest.php tests/Integration/SesSimulatorFixtureTest.php tests/Integration/PlatformSesSimulatorAuditTest.php --compact

      - name: Verify SES durable claims and account attempt concurrency
        run: php ./vendor/bin/pest tests/Integration/SesSendConcurrencyTest.php --compact

      - name: Verify AI chat, briefing replay and approval concurrency on MySQL
        run: php ./vendor/bin/pest tests/Integration/AiBranchMySqlConcurrencyTest.php --compact

      - name: Upload MySQL schema baseline candidate
        if: always() && hashFiles('database/schema/mysql-schema.sql') && hashFiles('database/schema/mysql-schema.sha256')
        uses: actions/upload-artifact@v4
        with:
          name: mysql-schema-baseline-${{ github.run_id }}
          path: database/schema/
          if-no-files-found: error
          retention-days: 7

      - name: Require the reviewed baseline in source control
        run: |
          set -euo pipefail
          git ls-files --error-unmatch database/schema/mysql-schema.sql database/schema/mysql-schema.sha256 >/dev/null
