name: tests
'on':
  pull_request:
    branches:
    - develop
    - main
    - master
    - workos
    - codex/everbranch-enterprise-intake
    - codex/enterprise-collaboration-ask
    - codex/enterprise-workflow-briefing
    - codex/enterprise-reviewer-operations
    - codex/enterprise-client-provisioning
    - codex/enterprise-prefixed-integrations
    - codex/enterprise-painpoint-demo
    - codex/enterprise-executive-visibility
    - codex/enterprise-voice-finale
    - codex/evergrove-payments-iphone-*
  workflow_dispatch: null
  workflow_call:
    inputs:
      mysql_mode:
        description: Only deploy.yml may use skip when its separate production migration gate is authoritative.
        type: string
        default: all
        required: false
  schedule:
  - cron: 0 8 * * *
concurrency:
  group: release-validation-v2-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  plan:
    name: Classify the exact change
    runs-on: ubuntu-24.04
    outputs:
      tier: ${{ steps.policy.outputs.tier }}
      head: ${{ steps.policy.outputs.head }}
      reason: ${{ steps.policy.outputs.reason }}
      verify_presentation: ${{ steps.policy.outputs.verify_presentation }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Install presentation parser
      run: python3 -m pip install --disable-pip-version-check tinycss2==1.4.0
    - name: Use the trusted base policy; unknown changes stay full
      id: policy
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        EVENT_NAME: ${{ github.event_name }}
      run: |
        set -euo pipefail
        if [ -z "$BASE_SHA" ]; then BASE_SHA="$(git rev-parse HEAD^)"; fi
        report="$RUNNER_TEMP/presentation-plan.json"
        if [ "$EVENT_NAME" = 'pull_request' ] && [ "$BASE_REF" = 'main' ] && git show "$BASE_SHA:scripts/ci/presentation-policy.py" > "$RUNNER_TEMP/trusted-presentation-policy.py" 2>/dev/null; then
          python3 "$RUNNER_TEMP/trusted-presentation-policy.py" --base "$BASE_SHA" --head "$HEAD_SHA" --output "$report"
        else
          python3 - "$report" "$BASE_SHA" "$HEAD_SHA" <<'PYTHON'
        import json,sys
        from pathlib import Path
        Path(sys.argv[1]).write_text(json.dumps({'tier':'full','reason':'policy_not_on_base','base':sys.argv[2],'head':sys.argv[3]}))
        PYTHON
        fi
        python3 - "$report" "$BASE_SHA" "$HEAD_SHA" <<'PYTHON'
        import json,os,subprocess,sys
        from pathlib import Path
        report=json.loads(Path(sys.argv[1]).read_text())
        if report.get('tier') not in {'full','presentation'} or report.get('head') != sys.argv[3]:
            raise SystemExit('Invalid validation plan')
        changed=subprocess.check_output(['git','diff','--name-only',sys.argv[2],sys.argv[3]]).decode().splitlines()
        policy_inputs={'.github/workflows/tests.yml','scripts/ci/presentation-policy.py','scripts/ci/require-release-results.py','tests/ci/test_presentation_policy.py','tests/e2e/presentation-smoke.browser.mjs'}
        verify=report['tier']=='presentation' or bool(set(changed)&policy_inputs)
        with open(os.environ['GITHUB_OUTPUT'],'a') as output:
            for key,value in {'tier':report['tier'],'head':sys.argv[3],'reason':report['reason'],'verify_presentation':str(verify).lower()}.items():
                output.write(f'{key}={value}\n')
        with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
            summary.write(f"Validation plan: **{report['tier']}** ({report['reason']}).\n")
        PYTHON
  build:
    name: Build and shared contracts
    runs-on: ubuntu-24.04
    environment: Testing
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Check release workflow contracts
      run: |-
        python3 -m pip install --disable-pip-version-check PyYAML==6.0.3 tinycss2==1.4.0
        python3 -m unittest discover -s tests/ci -p "test_parallel_release.py" -v
        python3 -m unittest discover -s tests/ci -p "test_forge_pinning.py" -v
        python3 -m unittest discover -s tests/ci -p "test_presentation_policy.py" -v
    - name: Use official Ubuntu package mirrors
      timeout-minutes: 2
      shell: bash
      run: |
        python3 scripts/ci/test_ubuntu_official_mirrors.py
        sudo python3 scripts/ci/ubuntu-official-mirrors.py
    - name: Bound package network waits and diagnose runner connectivity
      timeout-minutes: 2
      shell: bash
      run: |
        python3 scripts/ci/test_ci_package_network.py
        sudo python3 scripts/ci/ci-package-network.py
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        tools: composer:v2
        coverage: none
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: npm
    - name: Locate Composer cache
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
    - name: Cache Composer downloads
      uses: actions/cache@v5
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-php-8.4-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-8.4-composer-
    - name: Configure Flux Composer auth
      env:
        FLUX_USERNAME: ${{ secrets.FLUX_USERNAME }}
        FLUX_LICENSE_KEY: ${{ secrets.FLUX_LICENSE_KEY }}
      run: composer config http-basic.composer.fluxui.dev "$FLUX_USERNAME" "$FLUX_LICENSE_KEY"
    - name: Verify test prerequisites
      env:
        FLUX_USERNAME: ${{ secrets.FLUX_USERNAME }}
        FLUX_LICENSE_KEY: ${{ secrets.FLUX_LICENSE_KEY }}
      run: |-
        set -euo pipefail
        if [ ! -f phpunit.xml ] || [ ! -d tests ]; then
          echo "::error::Release gate cannot run without phpunit.xml and tests/."
          exit 1
        fi
        if grep -q '"livewire/flux"' composer.json && { [ -z "$FLUX_USERNAME" ] || [ -z "$FLUX_LICENSE_KEY" ]; }; then
          echo "::error::Testing environment Flux credentials are required."
          exit 1
        fi
    - name: Install PHP dependencies
      run: composer install --no-interaction --prefer-dist --optimize-autoloader
    - name: Install Node dependencies
      run: npm ci
    - name: Verify property client recovery and types
      run: |
        node --test tests/e2e/rentals-client.test.mjs
        npx tsc --noEmit --target ES2022 --module ESNext --moduleResolution Bundler --jsx react-jsx --allowJs --skipLibCheck --esModuleInterop resources/js/rentals/app.tsx
    - name: Verify Team preservation and work contracts with synthetic data
      run: |
        npm run test:team-work-local
        node --test tests/e2e/team-assistant-loader.test.mjs
    - name: Verify Teams scanner protocol and operator script contracts
      run: |
        python3 tests/Unit/Operations/test_teams_clamav_health.py
        bash -n scripts/ops/install-teams-clamav.sh
    - name: Build pinned custom-label vector tracer
      run: |
        rustup target add x86_64-unknown-linux-musl
        CARGO_BUILD_TARGET=x86_64-unknown-linux-musl CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=rust-lld scripts/labels/install-vtracer.sh "$RUNNER_TEMP/label-tools"
        (cd "$RUNNER_TEMP/label-tools" && sha256sum vtracer-0.6.5 > vtracer-0.6.5.sha256)
        echo "WHOLESALE_LABEL_VTRACER=$RUNNER_TEMP/label-tools/vtracer-0.6.5" >> "$GITHUB_ENV"
      if: needs.plan.outputs.tier == 'full'
    - name: Retain pinned Linux label tracer
      uses: actions/upload-artifact@v4
      with:
        name: wholesale-label-tracer-linux
        path: |
          ${{ runner.temp }}/label-tools/vtracer-0.6.5
          ${{ runner.temp }}/label-tools/vtracer-0.6.5.sha256
        if-no-files-found: error
        retention-days: 7
        overwrite: true
      if: needs.plan.outputs.tier == 'full'
    - name: Prepare application key
      run: |
        cp .env.example .env
        php artisan key:generate
    - name: Build frontend assets
      run: npm run build
    - name: Validate subscription protocols against captured original-app schema
      run: node scripts/ci/validate-subscription-shopify-api.mjs
    - name: Retain this run's frontend build
      uses: actions/upload-artifact@v4
      with:
        name: release-build-${{ github.run_id }}
        path: |
          public/build
          apps/enterprise/public/build
        if-no-files-found: error
        retention-days: 3
        overwrite: true
    - name: Install browsers for presentation validation
      if: needs.plan.outputs.verify_presentation == 'true'
      run: npx playwright install --with-deps chromium webkit
    - name: Verify presentation safety and browser smoke
      if: needs.plan.outputs.verify_presentation == 'true'
      run: |-
        php artisan view:cache
        php -d memory_limit=1G vendor/bin/pest --compact tests/Feature/Auth/AuthTenantContextTest.php tests/Feature/Tenancy/TenantIsolationGuardrailTest.php tests/Feature/Tenancy/CrossTenantIdorGuardTest.php tests/Feature/ShopifyEmbeddedSurfaceIsolationTest.php
        node tests/e2e/presentation-smoke.browser.mjs
    - name: Retain presentation failure evidence
      if: failure() && needs.plan.outputs.verify_presentation == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: presentation-failure-${{ github.run_id }}-${{ github.run_attempt }}
        path: test-results/presentation-smoke/
        if-no-files-found: ignore
        retention-days: 3
    needs: plan
  php:
    name: PHP 8.4 shard ${{ matrix.shard }}/6
    needs:
    - plan
    - build
    runs-on: ubuntu-24.04
    environment: Testing
    strategy:
      fail-fast: false
      matrix:
        shard:
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        tools: composer:v2
        coverage: none
    - name: Locate Composer cache
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
    - name: Cache Composer downloads
      uses: actions/cache@v5
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-php-8.4-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-8.4-composer-
    - name: Configure Flux Composer auth
      env:
        FLUX_USERNAME: ${{ secrets.FLUX_USERNAME }}
        FLUX_LICENSE_KEY: ${{ secrets.FLUX_LICENSE_KEY }}
      run: composer config http-basic.composer.fluxui.dev "$FLUX_USERNAME" "$FLUX_LICENSE_KEY"
    - name: Install PHP dependencies
      run: composer install --no-interaction --prefer-dist --optimize-autoloader
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: npm
    - name: Install Node dependencies
      run: npm ci
    - name: Prepare application key
      run: |
        cp .env.example .env
        php artisan key:generate
    - name: Restore this run's frontend build
      uses: actions/download-artifact@v4
      with:
        name: release-build-${{ github.run_id }}
        path: .
    - name: Use official Ubuntu package mirrors
      timeout-minutes: 2
      shell: bash
      run: |
        python3 scripts/ci/test_ubuntu_official_mirrors.py
        sudo python3 scripts/ci/ubuntu-official-mirrors.py
    - name: Bound package network waits and diagnose runner connectivity
      timeout-minutes: 2
      shell: bash
      run: |
        python3 scripts/ci/test_ci_package_network.py
        sudo python3 scripts/ci/ci-package-network.py
    - name: Prepare safe PDF conversion
      timeout-minutes: 12
      run: |
        if ! command -v gs >/dev/null; then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ghostscript
        fi
        echo "WHOLESALE_LABEL_GS=$(command -v gs)" >> "$GITHUB_ENV"
    - name: Restore pinned Linux label tracer
      uses: actions/download-artifact@v4
      with:
        name: wholesale-label-tracer-linux
        path: ${{ runner.temp }}/label-tools
    - name: Verify pinned label tracer
      run: |-
        cd "$RUNNER_TEMP/label-tools"
        sha256sum --check vtracer-0.6.5.sha256
        chmod +x vtracer-0.6.5
        echo "WHOLESALE_LABEL_VTRACER=$RUNNER_TEMP/label-tools/vtracer-0.6.5" >> "$GITHUB_ENV"
    - name: Verify PHP runtime inputs before the suite
      run: |-
        test -f public/build/manifest.json
        test -f apps/enterprise/public/build/manifest.json
        node --input-type=module -e "await import('sharp')"
    - name: Run PHP test shard in parallel
      run: |-
        python3 scripts/ci/php-test-shards.py --index=${{ matrix.shard }} --total=6
        php -d memory_limit=1G ./vendor/bin/pest --parallel --compact --configuration=.phpunit-ci.xml
    if: needs.plan.outputs.tier == 'full'
  browser:
    name: Browser checks (${{ matrix.group }})
    needs:
    - plan
    - build
    runs-on: ubuntu-24.04
    environment: Testing
    strategy:
      fail-fast: false
      matrix:
        group:
        - teams
        - commerce
        - workspace
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        tools: composer:v2
        coverage: none
    - name: Locate Composer cache
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
    - name: Cache Composer downloads
      uses: actions/cache@v5
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-php-8.4-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-8.4-composer-
    - name: Configure Flux Composer auth
      env:
        FLUX_USERNAME: ${{ secrets.FLUX_USERNAME }}
        FLUX_LICENSE_KEY: ${{ secrets.FLUX_LICENSE_KEY }}
      run: composer config http-basic.composer.fluxui.dev "$FLUX_USERNAME" "$FLUX_LICENSE_KEY"
    - name: Install PHP dependencies
      run: composer install --no-interaction --prefer-dist --optimize-autoloader
    - name: Prepare application key
      run: |
        cp .env.example .env
        php artisan key:generate
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: npm
    - name: Install Node dependencies
      run: npm ci
    - name: Restore this run's frontend build
      uses: actions/download-artifact@v4
      with:
        name: release-build-${{ github.run_id }}
        path: .
    - name: Use official Ubuntu package mirrors
      timeout-minutes: 2
      shell: bash
      run: |
        python3 scripts/ci/test_ubuntu_official_mirrors.py
        sudo python3 scripts/ci/ubuntu-official-mirrors.py
    - name: Bound package network waits and diagnose runner connectivity
      timeout-minutes: 2
      shell: bash
      run: |
        python3 scripts/ci/test_ci_package_network.py
        sudo python3 scripts/ci/ci-package-network.py
    - name: Install browsers for Fleet embedding checks
      timeout-minutes: 45
      run: npx playwright install --with-deps chromium webkit
    - name: Verify authenticated Teams Studio and sparse event calendars
      run: |
        node tests/e2e/team-studio-live.browser.mjs
        node tests/e2e/team-operations-calendar.browser.mjs
        node tests/e2e/team-event-calendar-window.browser.mjs
        node tests/e2e/team-browser-toolbar.browser.mjs
        node tests/e2e/team-main-event-surface.browser.mjs
        node tests/e2e/team-event-detail-lifecycle.browser.mjs
        node tests/e2e/team-event-updates.browser.mjs
        node tests/e2e/team-setup.browser.mjs
        node tests/e2e/team-task-cards.browser.mjs
        node tests/e2e/team-universal-search.browser.mjs
        node tests/e2e/team-assistant.browser.mjs
      if: matrix.group == 'teams'
    - name: Verify connected event Sales and Customers
      run: node tests/e2e/team-event-commerce.browser.mjs
      if: matrix.group == 'teams'
    - name: Verify Birthday Club desktop and mobile states
      run: node tests/e2e/birthday-club-browser.mjs
      if: matrix.group == 'commerce'
    - name: Verify wholesale cart and private-label buyer workflows
      run: |
        node tests/e2e/wholesale-quantity-browser.mjs
        node tests/e2e/wholesale-labels-browser.mjs
        node tests/e2e/wholesale-reorder-browser.mjs
        node tests/e2e/wholesale-cart-refresh-browser.mjs
        node tests/e2e/wholesale-label-admin-browser.mjs
        node tests/e2e/wholesale-decision-controls.mjs
        node tests/e2e/wholesale-outreach-copy.mjs
        node --test scripts/labels/batch-import.test.mjs
        npx tsc --noEmit -p extensions/wholesale-order-notes/tsconfig.json
      if: matrix.group == 'commerce'
    - name: Verify wholesale checkout validation Function
      run: |
        npm ci --prefix extensions/wholesale-checkout-access
        npm exec --yes --package=@shopify/cli@5.0.0 -- npm --prefix extensions/wholesale-checkout-access test -- --run
      if: matrix.group == 'commerce'
    - name: Verify retained bundle validation Function
      run: |
        npm ci --prefix extensions/everbranch-bundle-scent-validation
        npm exec --yes --package=@shopify/cli@5.0.0 -- npm --prefix extensions/everbranch-bundle-scent-validation test -- --run
      if: matrix.group == 'commerce'
    - name: Verify email photo selection with fictional files
      run: |
        npx tsc --noEmit --jsx react-jsx --module ESNext --moduleResolution Bundler --target ES2022 --lib ES2022,DOM --esModuleInterop --skipLibCheck resources/js/shopify/wholesale-messaging.tsx
        node tests/e2e/email-photo-selector.mjs
      if: matrix.group == 'commerce'
    - name: Verify native shipping desktop and mobile recovery
      run: node --test tests/e2e/website-shipping.test.mjs
      if: matrix.group == 'workspace'
    - name: Verify Trajectory mobile household navigation
      run: npm run test:trajectory:mobile
      if: matrix.group == 'workspace'
    - name: Verify Fleet embedding and allowance in Chromium and WebKit
      run: npm run test:highlevel-fleet
      if: matrix.group == 'workspace'
    - name: Verify native parcel and freight workflows with fictional providers
      run: |
        npm run test:shipping
        npm run test:freight
      if: matrix.group == 'workspace'
    - name: Verify conversational voice, memory and stop controls with fictional fixtures
      run: node tests/browser/ai-voice-conversation.smoke.mjs
      if: matrix.group == 'workspace'
    - name: Verify workspace branch settings in Chromium and WebKit
      run: |
        BRANCH_SETTINGS_FIXTURES=1 php vendor/bin/pest --compact tests/Feature/Everbranch/BranchSettingsTest.php
        GUIDED_SETTINGS_FIXTURES=1 php vendor/bin/pest --compact tests/Feature/Onboarding/WorkspaceSettingsTest.php
        npx playwright test -c playwright.branches.config.ts
      if: matrix.group == 'workspace'
    - name: Verify Marketplace management in Chromium and WebKit
      run: |
        MARKETPLACE_CONSOLE_FIXTURES=1 php vendor/bin/pest --compact tests/Feature/Marketplace/MarketManagementTest.php
        npx playwright test -c playwright.marketplace.config.ts
      if: matrix.group == 'workspace'
    - name: Verify native property workspace in Chromium and WebKit
      run: node tests/e2e/rentals-workspace.browser.mjs
      if: matrix.group == 'workspace'
    - name: Verify public offer and accessibility in Chromium and WebKit
      run: npx playwright test -c playwright.public.config.ts --grep-invert 'stable public'
      if: matrix.group == 'workspace'
    - name: Retain browser failure evidence
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: browser-failure-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: test-results/
        if-no-files-found: ignore
        retention-days: 3
    if: needs.plan.outputs.tier == 'full'
  ci:
    name: ci (8.4)
    runs-on: ubuntu-24.04
    needs:
    - plan
    - build
    - php
    - browser
    if: always()
    steps:
    - uses: actions/checkout@v6
    - name: Require every validation job to succeed
      env:
        JOB_RESULTS: ${{ toJSON(needs) }}
        EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      run: python3 scripts/ci/require-release-results.py ci
  mysql:
    name: MySQL 8.4 (${{ matrix.group }})
    runs-on: ubuntu-latest
    environment: Testing
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: everbranch_ci
          MYSQL_ROOT_PASSWORD: root
        ports:
        - 3306:3306
        options: --health-cmd="mysqladmin ping --host=127.0.0.1 --password=root" --health-interval=5s --health-timeout=5s --health-retries=12
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: everbranch_ci
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        tools: composer:v2
        coverage: none
    - name: Locate Composer cache
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
    - name: Cache Composer downloads
      uses: actions/cache@v5
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-php-8.4-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-8.4-composer-
    - name: Configure Flux Composer auth
      env:
        FLUX_USERNAME: ${{ secrets.FLUX_USERNAME }}
        FLUX_LICENSE_KEY: ${{ secrets.FLUX_LICENSE_KEY }}
      run: composer config http-basic.composer.fluxui.dev "$FLUX_USERNAME" "$FLUX_LICENSE_KEY"
    - name: Install PHP dependencies
      run: composer install --no-interaction --prefer-dist --optimize-autoloader
    - name: Prepare application key
      run: |
        cp .env.example .env
        php artisan key:generate
    - name: Resolve migration rehearsal baseline
      id: migration-base
      env:
        PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
      run: |
        set -euo pipefail
        base_sha="$PULL_REQUEST_BASE"
        if [ -z "$base_sha" ]; then
          base_sha="$(git rev-parse HEAD^)"
        fi
        echo "sha=$base_sha" >> "$GITHUB_OUTPUT"
      if: matrix.group == 'schema'
    - name: Initialize isolated schema for durable suites
      if: matrix.group == 'subscriptions' || matrix.group == 'concurrency'
      run: |-
        set -euo pipefail
        if [ "$DB_HOST" != '127.0.0.1' ] || [ "$DB_DATABASE" != 'everbranch_ci' ]; then
          echo "::error::Refusing schema setup outside this runner's disposable MySQL."
          exit 1
        fi
        php artisan migrate --force
    - name: Lint changed migrations
      run: php scripts/ci/lint-migrations.php --base="${{ steps.migration-base.outputs.sha }}"
      if: matrix.group == 'schema'
    - name: Verify clean and partial migration paths
      env:
        TEAM_WORK_DISPOSABLE_MYSQL: '1'
        SES_PLATFORM_DISPOSABLE_MYSQL: '1'
        WHOLESALE_LABELS_DISPOSABLE_MYSQL: '1'
      run: php ./vendor/bin/pest tests/Integration/WholesaleLabelsMySqlRecoveryTest.php tests/Integration/WorkflowStudioMySqlMigrationRecoveryTest.php
        tests/Integration/HighLevelFleetMySqlMigrationRecoveryTest.php tests/Integration/TenantMailMySqlMigrationRecoveryTest.php tests/Integration/FleetOperationsMySqlMigrationRecoveryTest.php
        tests/Integration/SoccerMySqlMigrationRecoveryTest.php tests/Integration/SoccerAllocationConcurrencyTest.php tests/Integration/MarketingDeskMySqlRecoveryTest.php
