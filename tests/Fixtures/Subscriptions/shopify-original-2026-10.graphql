}

type MoneyBag {
  shopMoney: MoneyV2!
}

type MoneyV2 {
  amount: Decimal!
  currencyCode: CurrencyCode!
}

type Mutation {
  subscriptionBillingAttemptCreate(subscriptionContractId: ID!, subscriptionBillingAttemptInput: SubscriptionBillingAttemptInput!): SubscriptionBillingAttemptCreatePayload
  subscriptionContractActivate(actor: SubscriptionActor, subscriptionContractId: ID!): SubscriptionContractActivatePayload
  subscriptionContractCalculationCommit(id: ID!): SubscriptionContractCalculationCommitPayload
  subscriptionContractCancel(actor: SubscriptionActor, subscriptionContractId: ID!): SubscriptionContractCancelPayload
  subscriptionContractCreateCalculate(contractCreateInput: SubscriptionContractCalculationContractCreateInput!): SubscriptionContractCreateCalculatePayload
  subscriptionContractPause(actor: SubscriptionActor, subscriptionContractId: ID!): SubscriptionContractPausePayload
  subscriptionContractSetNextBillingDate(contractId: ID!, date: DateTime!): SubscriptionContractSetNextBillingDatePayload
  subscriptionContractUpdateCalculate(actor: SubscriptionActor, contractId: ID!, contractUpdateInput: SubscriptionContractCalculationContractUpdateInput!): SubscriptionContractUpdateCalculatePayload
}

interface Node {
  id: ID!
}

type Order implements Node {
  cancelledAt: DateTime
  createdAt: DateTime!
  currentTotalPriceSet: MoneyBag!
  customAttributes: [Attribute!]!
