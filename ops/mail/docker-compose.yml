# Run on a dedicated mail host, not the existing Everbranch web droplet.
# Pin the minor release; review upstream release notes before upgrading.
services:
  stalwart:
    image: stalwartlabs/stalwart:v0.16
    restart: unless-stopped
    ports:
      - "25:25"       # server-to-server SMTP
      - "465:465"     # TLS submission
      - "587:587"     # STARTTLS submission
      - "993:993"     # optional IMAPS for external mail clients
      - "127.0.0.1:8080:8080" # bootstrap/management; never expose publicly
      - "127.0.0.1:8443:443"   # HTTPS/JMAP through a dedicated reverse proxy
    volumes:
      - stalwart-config:/etc/stalwart
      - stalwart-data:/var/lib/stalwart
    environment:
      STALWART_PUBLIC_URL: ${STALWART_PUBLIC_URL:?Set the public HTTPS mail URL}
      STALWART_RECOVERY_ADMIN: ${STALWART_RECOVERY_ADMIN:?Set a temporary bootstrap credential}
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
volumes:
  stalwart-config:
  stalwart-data:
